[package]
name = "nearby-transfer-service"
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Quick Share and LocalSend service for Manhattan Transfer"
readme = "README.md"
publish = false

[[bin]]
name = "nearby-transfer-service"
path = "src/core/main.rs"

[dependencies]
localsend = { path = "third_party/localsend", features = ["discovery"] }
tokio-util = { version = "0.7", features = ["rt"] }
tempfile = "3"
bytes = "1"
rcgen = { version = "0.14", features = ["pem"] }
pem = "4"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
arc-swap = "1"
dirs = "7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
rand = "0.10"
rqs_lib = { path = "third_party/rqs_lib", default-features = false, features = ["experimental"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
snow = "0.10"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "io-util", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "6.0", default-features = false, features = ["tokio", "service", "proxy"] }

[profile.release]
strip = "symbols"
